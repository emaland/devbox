name: CI

# The same check as the local check of record: scripts/check.sh runs the
# full-history secret scan, go vet and go test (the cmd tests start
# LocalStack in Docker and never reach real AWS), Nix evaluation of the
# template, and shellcheck. This repository is public, and so are these logs:
# no step prints the environment, a secret or any machine's configuration,
# and no secret is used.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older run only on a pull request; every commit
  # on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: warp-ubuntu-2404-x64-4x
    timeout-minutes: 30
    steps:
      # Full history: the secret scan reads every commit of every branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # scripts/check.sh needs Nix with a nixpkgs channel: the template is
      # evaluated against it, and gitleaks, jq and shellcheck come from it.
      # The same release as the devbox runs. v32.1.0 verifies the installer's
      # checksum. The action always gives Nix the job's token for GitHub
      # downloads; it cannot be turned off, it is read-only here
      # (contents: read), masked in logs, and ends with the job.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Check
        run: scripts/check.sh
