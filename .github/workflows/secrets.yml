name: Secret scan

# This repository is public. This runs on every push to every branch and on
# every pull request, separately from the other checks, which run on pushes to
# main only.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Scan every commit on every fetched branch for credentials and fail on
    # any finding. Logs of this job are public too: for a finding it prints
    # the rule, commit, file and line only, and no step prints the
    # environment or any file content.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan full history
        # A finding prints the rule, commit, file and line, never the value.
        # Do not fix a finding forward: the value stays in history. See
        # CONTRIBUTING.md.
        #
        # gitleaks' own verbose output is not used: besides the redacted
        # match it prints the surrounding line and the commit author's name
        # and email. The report goes to a file that is never uploaded, and
        # only four fields of it are printed.
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --no-banner --no-color \
            --log-opts="--all" --report-format json --report-path "$report" . \
            >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "No findings."
            exit 0
          fi
          if [ -s "$report" ]; then
            echo "Findings (rule, commit, file, line):"
            jq -r '.[] | "\(.RuleID)  \(.Commit[0:7])  \(.File)  \(.StartLine)"' "$report"
          else
            echo "gitleaks exited with status $status and wrote no report."
          fi
          exit 1
